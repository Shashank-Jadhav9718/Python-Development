version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=FastApi_practice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    # 🔑 Tell Uvicorn to look inside the FastApi folder for main.py
    command: uvicorn FastApi.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: .
    # 🔑 Tell Streamlit to run the app.py file located inside the FastApi folder
    command: streamlit run FastApi/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data: